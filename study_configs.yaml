LDOT-002:
  name: PIAMA Sandbox
  config_path: piama-sandbox.env
  ldot_variables:
    ldot_study_id: 5c9c6a47-c8d7-8142-a8c8-ccdcb8a8044b
    id_deelnemer_entity: 7f61b810-00ed-1d41-8a33-4164f25ebad0 # Entity ID for the participant entity in the study
    id_location: 427f304f-9d95-44f5-8f7b-d6a1ce1db293
  work_units:
    unit-1:
      name: Create Qualtrics survey link, dummy survey
      trigger: 5d31129c-d814-5d4b-a96f-048cadc150ce #Action event for when the qualtrics survey link creation  hasn't been done
      work_action:
        type: Create Qualtrics survey link
        variables:
          ldot_custom_var_qualtrics_link: customVar01
          qualtrics_survey_id: SV_40id5EiKiNtjob4
          directory_id: POOL_10pyxk9leSUisrT
          distribution_id: EMD_9abhwOQXnFQJoKg
          mailing_list_id: CG_s5ya4SGvqQpYFUJ
          embedded_data_field: RESPNRK
      resolution: 31599192-8e9b-4341-b7f4-8b8967dd846a #Action event for when the qualtrics survey link creation is completed
    unit-2:
      name: Check Qualtrics survey progress, dummy survey
      trigger: 9f09f2cf-32cc-844d-9a41-7a44accd3dfd # Event action for when the survey progress is Wait for entry
      work_action:
        type: Check Qualtrics survey progress
        variables:
          qualtrics_survey_id: SV_40id5EiKiNtjob4
          embedded_data_field: RESPNRK
      resolution: 120d298d-9aa9-084b-abc6-432148db0e10 # eaid_survey_progress_completed